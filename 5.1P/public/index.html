<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book List</title>
</head>
<body>
  <h1>Book List</h1>
  <div id="bookListDisplay"></div>

  <script>

    const bDisplay = document.getElementById('bookListDisplay');

    async function loadBooks() {
        try {
            const response = await fetch('/api/books');
            const result = await response.json();

            const books = result.data || result

            bDisplay.innerHTML = books.map(book => `
                <div class="book-card">
                    <h3>${book.title}</h3>
                    <p>Author: ${book.author}</p>
                </div>
            `).join('');
            

        } catch(err) {
            console.error('fetch failedl', err);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadBooks();
    })
  </script>
</body>
</html>
